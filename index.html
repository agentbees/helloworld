<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f5f7fb;
        color: #182230;
      }

      main {
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="greeting">Hello World</h1>
    </main>
    <script>
      // Keep the greeting visible even when the page is opened directly.
      document.querySelector('#greeting').textContent = 'Hello World';
    </script>
  </body>
</html>
